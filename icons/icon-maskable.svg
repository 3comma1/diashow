    <use xlink:href="#m1" fill="none" stroke="#00f0ff" stroke-width="5"/>

    <use xlink:href="#m2" fill="#ff2bd6" opacity="0.14"/>
    <use xlink:href="#m2" fill="none" stroke="#ff2bd6" stroke-width="30" opacity="0.07"/>
    <use xlink:href="#m2" fill="none" stroke="#ff2bd6" stroke-width="16" opacity="0.16"/>
    <use xlink:href="#m2" fill="none" stroke="#ff2bd6" stroke-width="5"/>

    <use xlink:href="#m3" fill="#b6ff2b" opacity="0.14"/>
    <use xlink:href="#m3" fill="none" stroke="#b6ff2b" stroke-width="30" opacity="0.07"/>
    <use xlink:href="#m3" fill="none" stroke="#b6ff2b" stroke-width="16" opacity="0.16"/>
    <use xlink:href="#m3" fill="none" stroke="#b6ff2b" stroke-width="5"/>

    <use xlink:href="#m4" fill="#a86bff" opacity="0.14"/>
    <use xlink:href="#m4" fill="none" stroke="#a86bff" stroke-width="30" opacity="0.07"/>
    <use xlink:href="#m4" fill="none" stroke="#a86bff" stroke-width="16" opacity="0.16"/>
    <use xlink:href="#m4" fill="none" stroke="#a86bff" stroke-width="5"/>

    <use xlink:href="#m5" fill="#ffb02b" opacity="0.14"/>
    <use xlink:href="#m5" fill="none" stroke="#ffb02b" stroke-width="30" opacity="0.07"/>
    <use xlink:href="#m5" fill="none" stroke="#ffb02b" stroke-width="16" opacity="0.16"/>
    <use xlink:href="#m5" fill="none" stroke="#ffb02b" stroke-width="5"/>

    <use xlink:href="#m6" fill="#00f0ff" opacity="0.14"/>
    <use xlink:href="#m6" fill="none" stroke="#00f0ff" stroke-width="30" opacity="0.07"/>
