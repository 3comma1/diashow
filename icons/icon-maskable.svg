<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NeonMosaik">
  <title>NeonMosaik</title>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a3d"/>
      <stop offset="0.55" stop-color="#080b18"/>
      <stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="halom" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#3d2bff" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <rect id="m1" x="96" y="96" width="97.33" height="97.33" rx="22"/>
    <rect id="m2" x="207.33" y="96" width="208.67" height="97.33" rx="22"/>
    <rect id="m3" x="96" y="207.33" width="97.33" height="208.67" rx="22"/>
    <rect id="m4" x="207.33" y="207.33" width="97.33" height="97.33" rx="22"/>
    <rect id="m5" x="318.67" y="207.33" width="97.33" height="97.33" rx="22"/>
    <rect id="m6" x="207.33" y="318.67" width="208.67" height="97.33" rx="22"/>
  </defs>

  <!-- Full-bleed background: safe for maskable icons -->
  <rect width="512" height="512" fill="url(#bgm)"/>
  <rect width="512" height="512" fill="url(#halom)"/>

